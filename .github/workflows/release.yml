name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux archives (tar.gz)
          - os: ubuntu-latest
            targets: linux/amd64 linux/arm64 linux/386
          # macOS archives (tar.gz)
          - os: macos-latest
            targets: darwin/amd64 darwin/arm64
          # Windows archives (zip; zip is preinstalled on the runner)
          - os: windows-latest
            targets: windows/amd64 windows/arm64 windows/386
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git describe
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build matrix
        run: make cross VERSION=${{ github.ref_name }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/pkg
          for f in $TARGETS; do
            os=${f%/*}; arch=${f#*/}
            if [ $os = windows ]; then
              if command -v zip >/dev/null 2>&1; then
                (cd dist && zip -q pkg/rysh-$os-$arch.zip rysh-$os-$arch.exe checksums.txt)
              else
                # 7-Zip ships on the Windows runners even when Info-ZIP's zip is absent.
                (cd dist && 7z a -tzip pkg/rysh-$os-$arch.zip rysh-$os-$arch.exe checksums.txt)
              fi
            else
              (cd dist && tar -czf pkg/rysh-$os-$arch.tar.gz rysh-$os-$arch checksums.txt)
            fi
          done
          ls -l dist/pkg/
        env:
          TARGETS: ${{ matrix.targets }}
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: rysh-${{ github.ref_name }}-${{ matrix.os }}
          path: dist/pkg/
          if-no-files-found: error

  publish:
    name: create GitHub release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${GITHUB_REF#refs/tags/}
          cp scripts/install.sh dist/install.sh
          gh release create "$VER" \
            --title "ruyishell $VER" \
            --notes "ruyishell $VER — prebuilt binaries for macOS / Linux / Windows.

            macOS / Linux:

                curl -fsSL https://github.com/${GITHUB_REPOSITORY_OWNER,,}/ruyishell/releases/latest/download/install.sh | bash

            Windows: download the zip for your CPU architecture and put rysh.exe on your PATH." \
            --verify \
            dist/rysh-*.tar.gz dist/rysh-*.zip dist/install.sh
