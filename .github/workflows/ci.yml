name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: make fmtcheck
      - name: Vet
        run: make vet
      - name: Build
        # The integration tests re-exec the test binary through a real pty,
        # so a working build is verified by `go test` below as well.
        run: make build
      - name: Test
        run: make test
